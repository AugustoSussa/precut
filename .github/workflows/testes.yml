name: Testes automatizados

on:
  push:
    branches: [deploy/v6.1, testes-automatizados-v6-1]
  pull_request:
    branches: [deploy/v6.1]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependências de testes
        run: python -m pip install -r requirements-dev.txt
      - name: Executar suíte Python sem serviços externos
        env:
          DATABASE_URL: sqlite:///./testes-ci.sqlite3
          SECRET_KEY: segredo-exclusivo-ci-precut-com-mais-de-32-caracteres
        run: python -m pytest -q tests --junitxml=pytest-resultados.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pytest
          path: backend/pytest-resultados.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências originais
        run: npm ci
      - name: Instalar ferramentas de teste sem alterar o lockfile usado no Render
        run: npm install --no-save --package-lock=false vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0
      - name: Testar componentes React
        run: npx vitest run
      - name: Validar build do Next.js
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://example.invalid
        run: npm run build
